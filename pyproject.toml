[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crmf-dlt"
version = "0.1.0"
description = "Spherical CRMF/RHB finite-nucleus and nuclear-matter EOS calculations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "numba>=0.59",
  "matplotlib>=3.7",
]

[project.scripts]
crmf = "crmf.__main__:main"

[tool.setuptools.packages.find]
include = ["crmf*"]
